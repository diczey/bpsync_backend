version: '3.8'

# BPSync Backend API
# Database: ../database/docker-compose.yml

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bpsync-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://bpsync_app:bpsync_password@host.docker.internal:5432/bpsync
      - SECRET_KEY=bpsync-super-secret-key-change-in-production
      - USE_MOCK_DATA=false
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
    volumes:
      - ./models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
